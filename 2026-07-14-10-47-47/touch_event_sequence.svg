<svg viewBox="0 0 680 510" width="100%" role="img">
<title>Touch event to onTouchEvent sequence</title>
<desc>Kernel touch driver through EventHub/InputReader/InputDispatcher, WMS focus lookup, InputChannel socket into app ViewRootImpl down to View.onTouchEvent.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<line x1="70" y1="82" x2="70" y2="335" stroke="#5F5E5A" stroke-width="0.5" stroke-dasharray="4 4"/>
<line x1="200" y1="82" x2="200" y2="335" stroke="#5F5E5A" stroke-width="0.5" stroke-dasharray="4 4"/>
<line x1="340" y1="82" x2="340" y2="335" stroke="#5F5E5A" stroke-width="0.5" stroke-dasharray="4 4"/>
<line x1="470" y1="82" x2="470" y2="335" stroke="#5F5E5A" stroke-width="0.5" stroke-dasharray="4 4"/>

<rect x="30" y="40" width="80" height="36" rx="8" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="70" y="54" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#2C2C2A">触摸屏驱动</text>
<text x="70" y="68" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#444441">(kernel)</text>
<rect x="160" y="40" width="80" height="36" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="200" y="54" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#042C53">EventHub</text>
<text x="200" y="68" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#0C447C">+InputReader</text>
<rect x="300" y="40" width="80" height="36" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="54" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#042C53">InputDispatcher</text>
<text x="340" y="68" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#0C447C">(native)</text>
<rect x="430" y="40" width="80" height="36" rx="8" fill="#85B7EB" stroke="#185FA5" stroke-width="0.5"/>
<text x="470" y="54" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#042C53">WMS</text>
<text x="470" y="68" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#042C53">(system_server)</text>

<rect x="470" y="355" width="170" height="140" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="555" y="372" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="500" fill="#04342C">App 进程 (View 树)</text>
<text x="500" y="392" font-family="sans-serif" font-size="10" fill="#04342C">ViewRootImpl.dispatchInputEvent</text>
<text x="500" y="410" font-family="sans-serif" font-size="10" fill="#04342C">DecorView.dispatchTouchEvent</text>
<text x="500" y="428" font-family="sans-serif" font-size="10" fill="#04342C">Activity.dispatchTouchEvent</text>
<text x="500" y="446" font-family="sans-serif" font-size="10" fill="#04342C">PhoneWindow.superDispatch…</text>
<text x="500" y="464" font-family="sans-serif" font-size="10" fill="#04342C">ViewGroup.dispatchTouchEvent</text>
<text x="500" y="482" font-family="sans-serif" font-size="10" font-weight="500" fill="#04342C">View.onTouchEvent</text>

<line x1="70" y1="110" x2="198" y2="110" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="120" y="104" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5F5E5A">read() 原始事件</text>
<line x1="202" y1="150" x2="338" y2="150" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="270" y="144" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5F5E5A">NotifyMotion</text>
<line x1="340" y1="190" x2="468" y2="190" stroke="#185FA5" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="404" y="184" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#0C447C">查询焦点窗口</text>
<line x1="470" y1="230" x2="342" y2="230" stroke="#185FA5" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="406" y="224" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#0C447C">返回 InputChannel</text>
<line x1="340" y1="295" x2="468" y2="353" stroke="#0F6E56" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="405" y="315" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#04342C">socket 发 MotionEvent</text>

<line x1="560" y1="398" x2="560" y2="406" stroke="#0F6E56" stroke-width="0.8" marker-end="url(#arrow)"/>
<line x1="560" y1="416" x2="560" y2="424" stroke="#0F6E56" stroke-width="0.8" marker-end="url(#arrow)"/>
<line x1="560" y1="434" x2="560" y2="442" stroke="#0F6E56" stroke-width="0.8" marker-end="url(#arrow)"/>
<line x1="560" y1="452" x2="560" y2="460" stroke="#0F6E56" stroke-width="0.8" marker-end="url(#arrow)"/>
<line x1="560" y1="470" x2="560" y2="478" stroke="#0F6E56" stroke-width="0.8" marker-end="url(#arrow)"/>
</svg>