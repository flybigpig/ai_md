[package]
name = "rust-http-demo"
version = "0.1.0"
edition = "2021"

# 两个独立二进制：server（后端接口）和 client（前端请求）
[[bin]]
name = "server"
path = "src/server.rs"

[[bin]]
name = "client"
path = "src/client.rs"

[dependencies]
# 异步运行时（axum / reqwest 都依赖 tokio）
tokio = { version = "1", features = ["full"] }
# 后端 Web 框架，基于 hyper，API 简洁、类型安全
axum = { version = "0.7", features = ["json"] }
# 序列化 / 反序列化 JSON
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 前端（客户端）HTTP 请求库
reqwest = { version = "0.12", features = ["json"] }
